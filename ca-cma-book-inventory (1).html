<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THARUN'S BRAINERY Book Inventory Register — CA · CMA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0F1826;
    --ink-2:#16223A;
    --paper:#ECE3CD;
    --paper-2:#E2D6B8;
    --brass:#B4924C;
    --brass-dark:#8C6F34;
    --text:#1E2530;
    --text-soft:#5B5540;
    --green:#3E6B4C;
    --green-bg:#E1EADC;
    --amber:#B8862F;
    --amber-bg:#F3E7CC;
    --red:#9C3B32;
    --red-bg:#F1DAD6;
    --rule:rgba(30,37,48,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ink);
    background-image:
      radial-gradient(circle at 12% 8%, rgba(180,146,76,0.08), transparent 40%),
      radial-gradient(circle at 88% 92%, rgba(180,146,76,0.06), transparent 45%);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  .wrap{
    max-width:1180px;
    margin:0 auto;
    padding:36px 20px 80px;
  }
  /* ===== Cover header ===== */
  .cover{
    text-align:center;
    padding:38px 20px 30px;
    position:relative;
  }
  .cover .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    letter-spacing:0.32em;
    font-size:11px;
    color:var(--brass);
    text-transform:uppercase;
    margin-bottom:10px;
  }
  .cover h1{
    font-family:'Source Serif 4',serif;
    font-weight:700;
    font-size:clamp(30px,5vw,48px);
    color:var(--paper);
    margin:0 0 8px;
    letter-spacing:0.01em;
  }
  .cover .sub{
    font-family:'Source Serif 4',serif;
    font-style:italic;
    font-size:16px;
    color:#B9C2D4;
  }
  .cover .rule{
    width:120px;height:2px;
    margin:18px auto 0;
    background:linear-gradient(90deg,transparent, var(--brass), transparent);
  }

  /* ===== Dashboard strip ===== */
  .dash{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:1px;
    background:var(--rule);
    border:1px solid var(--brass-dark);
    border-radius:4px;
    overflow:hidden;
    margin:28px 0 24px;
  }
  .dash .cell{
    background:var(--paper);
    padding:16px 18px;
    text-align:center;
  }
  .dash .cell .num{
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    font-size:26px;
    color:var(--ink-2);
  }
  .dash .cell .lbl{
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--text-soft);
    margin-top:4px;
  }
  .dash .cell.alert .num{ color:var(--red); }

  /* ===== Search ===== */
  .toolbar{
    display:flex;
    gap:10px;
    align-items:center;
    margin-bottom:14px;
    flex-wrap:wrap;
  }
  .search{
    flex:1;
    min-width:200px;
    background:var(--paper);
    border:1px solid var(--brass-dark);
    border-radius:3px;
    padding:9px 12px;
    font-family:'Inter',sans-serif;
    font-size:14px;
    color:var(--text);
  }
  .search::placeholder{ color:var(--text-soft); }
  .search:focus{ outline:2px solid var(--brass); outline-offset:1px; }
  .reset-btn{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    background:transparent;
    border:1px solid var(--brass-dark);
    color:var(--paper);
    padding:9px 14px;
    border-radius:3px;
    cursor:pointer;
  }
  .reset-btn:hover{ background:rgba(180,146,76,0.15); }
  .reset-btn:focus-visible, .search:focus-visible{ outline:2px solid var(--brass); }

  /* ===== Ledger book shell ===== */
  .ledger{
    display:grid;
    grid-template-columns:56px 1fr;
    border:1px solid var(--brass-dark);
    border-radius:4px;
    overflow:hidden;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.6);
  }
  /* spine tabs (course selector) */
  .spine{
    background:var(--ink-2);
    display:flex;
    flex-direction:column;
  }
  .spine button{
    flex:1;
    writing-mode:vertical-rl;
    text-orientation:mixed;
    background:transparent;
    border:none;
    border-bottom:1px solid rgba(180,146,76,0.25);
    color:#8894AC;
    font-family:'Source Serif 4',serif;
    font-weight:600;
    font-size:15px;
    letter-spacing:0.06em;
    cursor:pointer;
    padding:14px 0;
  }
  .spine button:last-child{ border-bottom:none; }
  .spine button.active{
    background:var(--brass);
    color:var(--ink);
  }
  .spine button:hover:not(.active){ color:var(--paper); }
  .spine button:focus-visible{ outline:2px solid var(--paper); outline-offset:-2px; }

  /* main paper */
  .paper{
    background:var(--paper);
    background-image:repeating-linear-gradient(
      to bottom,
      transparent,
      transparent 43px,
      rgba(30,37,48,0.06) 44px
    );
    padding:0;
  }
  .level-tabs{
    display:flex;
    border-bottom:1px solid var(--brass-dark);
    background:var(--paper-2);
  }
  .level-tabs button{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    background:transparent;
    border:none;
    border-right:1px solid var(--brass-dark);
    color:var(--text-soft);
    padding:12px 18px;
    cursor:pointer;
  }
  .level-tabs button.active{
    background:var(--paper);
    color:var(--ink-2);
    font-weight:600;
  }
  .level-tabs button:hover:not(.active){ color:var(--text); }
  .level-tabs button:focus-visible{ outline:2px solid var(--brass-dark); outline-offset:-2px; }

  .table-scroll{ overflow-x:auto; }
  table{
    width:100%;
    border-collapse:collapse;
    min-width:640px;
  }
  thead th{
    text-align:left;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--text-soft);
    padding:16px 14px 8px;
    border-bottom:1px solid var(--brass-dark);
  }
  thead th.col-num{ text-align:center; }
  .group-row td{
    padding:16px 14px 4px;
    font-family:'Source Serif 4',serif;
    font-style:italic;
    font-size:13px;
    color:var(--brass-dark);
    border-bottom:1px solid transparent;
  }
  tbody tr.subject-row td{
    padding:9px 14px;
    border-bottom:1px solid var(--rule);
    vertical-align:middle;
  }
  .subj-name{
    font-family:'Source Serif 4',serif;
    font-size:14.5px;
    color:var(--text);
  }
  .qty-cell{ text-align:center; }
  .qty-box{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:rgba(255,255,255,0.5);
    border:1px solid var(--rule);
    border-radius:3px;
    padding:2px 4px;
  }
  .qty-box button{
    width:20px;height:20px;
    border:none;
    background:transparent;
    color:var(--brass-dark);
    font-size:14px;
    cursor:pointer;
    line-height:1;
    border-radius:2px;
  }
  .qty-box button:hover{ background:rgba(180,146,76,0.2); }
  .qty-box button:focus-visible{ outline:2px solid var(--brass-dark); }
  .qty-box input{
    width:34px;
    text-align:center;
    border:none;
    background:transparent;
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    font-weight:600;
    color:var(--ink-2);
  }
  .qty-box input:focus{ outline:none; }
  .qty-box input::-webkit-outer-spin-button,
  .qty-box input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }

  .stamp-cell{ text-align:center; }
  .stamp{
    display:inline-block;
    font-family:'IBM Plex Mono',monospace;
    font-size:9.5px;
    letter-spacing:0.06em;
    font-weight:600;
    text-transform:uppercase;
    padding:3px 8px;
    border-radius:2px;
    transform:rotate(-3deg);
    border:1px solid currentColor;
  }
  .stamp.in{ color:var(--green); background:var(--green-bg); }
  .stamp.low{ color:var(--amber); background:var(--amber-bg); }
  .stamp.out{ color:var(--red); background:var(--red-bg); }

  .empty-note{
    padding:30px 20px 40px;
    text-align:center;
    color:var(--text-soft);
    font-family:'Source Serif 4',serif;
    font-style:italic;
  }

  footer{
    text-align:center;
    margin-top:22px;
    color:#6E7893;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.05em;
  }

  @media (max-width:680px){
    .ledger{ grid-template-columns:40px 1fr; }
    .spine button{ font-size:12px; padding:10px 0; }
    .dash{ grid-template-columns:repeat(2,1fr); }
  }
  @media (prefers-reduced-motion: reduce){
    * { transition:none !important; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="cover">
    <div class="logo">
      <img src="logo.png" alt="Logo">
  </div>
    <h1>Tharun's Brainery Book Inventory Register</h1>
    <div class="sub">Concept &middot; Summary &middot; Compiler — across every level, CA and CMA</div>
    <div class="rule"></div>
  </div>

  <div class="dash" id="dash"></div>

  <div class="toolbar">
    <select id="locationSelect" class="search" style="max-width:220px;">
      <option value="Nungambakkam">Nungambakkam</option>
      <option value="Anna Nagar">Anna Nagar</option>
    </select>
  
    <input class="search" id="search" type="text"
           placeholder="Search a subject… e.g. Taxation, Costing, Auditing">
  
    <button class="reset-btn" id="resetBtn">Clear stock counts</button>
  </div>

  <div class="ledger">
    <div class="spine" id="spine"></div>
    <div class="paper">
      <div class="level-tabs" id="levelTabs"></div>
      <div class="table-scroll">
        <table id="table"></table>
      </div>
    </div>
  </div>

  <footer>entries are saved to your inventory automatically</footer>
</div>

<script>
// ---------- Data model ----------
const DATA = {
  CA: {
    Foundation: [
      { g:null, name:"Accounting" },
      { g:null, name:"Business Laws" },
      { g:null, name:"Quantitative Aptitude" },
      { g:null, name:"Business Economics" },
    ],
    Intermediate: [
      { g:"Group I", name:"Advanced Accounting" },
      { g:"Group I", name:"Corporate & Other Laws" },
      { g:"Group I", name:"Income Tax laws" },
      { g:"Group I", name:"Goods & Service Tax" },
      { g:"Group II", name:"Cost & Management Accounting" },
      { g:"Group II", name:"Auditing & Ethics" },
      { g:"Group II", name:"Financial Management" },
      { g:"Group II", name:"Strategic Management" },
    ],
    Final: [
      { g:"Group I", name:"Financial Reporting" },
      { g:"Group I", name:"Advanced Financial Management" },
      { g:"Group I", name:"Advanced Auditing & Professional Ethics" },
      { g:"Group II", name:"Direct Tax Laws & International Taxation" },
      { g:"Group II", name:"Indirect Tax Laws" },
      { g:"Group II", name:"Integrated Business Solutions" },
    ],
  },
  CMA: {
    Foundation: [
      { g:null, name:"Fundamentals of Business Laws & Communication" },
      { g:null, name:"Fundamentals of Financial & Cost Accounting" },
      { g:null, name:"Fundamentals of Business Mathematics & Statistics" },
      { g:null, name:"Fundamentals of Business Economics & Management" },
    ],
    Intermediate: [
      { g:"Group I", name:"Business Laws & Ethics" },
      { g:"Group I", name:"Financial Accounting" },
      { g:"Group I", name:"Direct Taxation"},
      { g:"Group I", name:"Indirect Taxation" },
      { g:"Group I", name:"Cost Accounting" },
      { g:"Group II", name:"Operations Management" },
      { g:"Group II", name:"Strategic Management" },
      { g:"Group II", name:"Corporate Accounting & Auditing" },
      { g:"Group II", name:"Financial Management & Business Data Analytics" },
      { g:"Group II", name:"Management Accounting" },
    ],
    Final: [
      { g:"Group I", name:"Corporate & Economic Laws" },
      { g:"Group I", name:"Strategic Financial Management" },
      { g:"Group I", name:"Direct Tax Laws & International Taxation" },
      { g:"Group I", name:"Strategic Cost Management" },
      { g:"Group II", name:"Cost & Management Audit" },
      { g:"Group II", name:"Corporate Financial Reporting" },
      { g:"Group II", name:"Indirect Tax Laws & Practice" },
      { g:"Group II", name:"Strategic Performance Management & Business Valuation" },
    ],
  },
};
const COURSES = ["CA","CMA"];
const LEVELS = ["Foundation","Intermediate","Final"];

function bookCols(level){
  return level === "Foundation"
    ? ["Concept Vol 1","Concept Vol 2","Summary","Compiler"]
    : ["Concept","Summary","Compiler"];
}

// ---------- State ----------
let state = {
    course: "CA",
    level: "Foundation",
    filter: "",
    location: "Nungambakkam"
};
let qty = {}; // key -> number
const STORE_KEY = "ca-cma-inventory-qty";

function keyFor(location, course, level, subject, col){
  return [location, course, level, subject, col].join("::");
}

function getTotalQty(course, level, subject, col) {
  const locations = ["Nungambakkam", "Anna Nagar"];

  return locations.reduce((total, location) => {
    return total + getQty(
      keyFor(location, course, level, subject, col)
    );
  }, 0);
}

async function loadQty(){
  try{
    const res = await window.storage.get(STORE_KEY, false);
    if(res && res.value){ qty = JSON.parse(res.value); }
  }catch(e){ qty = {}; }
}

let saveTimer = null;
function saveQty(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{ await window.storage.set(STORE_KEY, JSON.stringify(qty), false); }
    catch(e){ /* best effort */ }
  }, 250);
}

function getQty(k){ return qty[k] || 0; }
function setQty(k, v){
  v = Math.max(0, Math.min(9999, v|0));
  qty[k] = v;
  saveQty();
}

// ---------- Render: spine (course tabs) ----------
function renderSpine(){
  const el = document.getElementById('spine');
  el.innerHTML = "";
  COURSES.forEach(c=>{
    const btn = document.createElement('button');
    btn.textContent = c;
    if(c === state.course) btn.classList.add('active');
    btn.addEventListener('click', ()=>{ state.course = c; renderAll(); });
    el.appendChild(btn);
  });
}

// ---------- Render: level tabs ----------
function renderLevelTabs(){
  const el = document.getElementById('levelTabs');
  el.innerHTML = "";
  LEVELS.forEach(l=>{
    const btn = document.createElement('button');
    btn.textContent = l;
    if(l === state.level) btn.classList.add('active');
    btn.addEventListener('click', ()=>{ state.level = l; renderAll(); });
    el.appendChild(btn);
  });
}

// ---------- Render: table ----------
function statusFor(v){
  if(v <= 0) return {cls:'out', label:'Out'};
  if(v <= 10) return {cls:'low', label:'Low'};
  return {cls:'in', label:'In Stock'};
}

function renderTable(){
  const table = document.getElementById('table');
  const subjects = DATA[state.course][state.level];
  const cols = bookCols(state.level);
  const term = state.filter.trim().toLowerCase();
  const filtered = subjects.filter(s => s.name.toLowerCase().includes(term));

  table.innerHTML = "";

  if(filtered.length === 0){
    table.innerHTML = "";
    const wrap = document.createElement('div');
    wrap.className = 'empty-note';
    wrap.textContent = `No subject matches "${state.filter}" in ${state.course} ${state.level}.`;
    table.replaceWith(wrap);
    wrap.id = 'table';
    return;
  }

  const thead = document.createElement('thead');
  const trh = document.createElement('tr');
  const thSubj = document.createElement('th');
  thSubj.textContent = `${state.course} · ${state.level}`;
  trh.appendChild(thSubj);
  cols.forEach(c=>{
  // Branch stock
  const th = document.createElement('th');
  th.className = 'col-num';
  th.textContent = c;
  trh.appendChild(th);

  // Total stock
  const thTotal = document.createElement('th');
  thTotal.className = 'col-num';
  thTotal.textContent = "Total";
  trh.appendChild(thTotal);
});
  const thTotal = document.createElement('th');
thTotal.className = 'col-num';
thTotal.textContent = 'Total Books';
trh.appendChild(thTotal);

const thStatus = document.createElement('th');
thStatus.className = 'col-num';
thStatus.textContent = 'Status';
trh.appendChild(thStatus);
  thead.appendChild(trh);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  let lastGroup = undefined;
  filtered.forEach(s=>{
    if(s.g !== lastGroup && s.g){
      const gr = document.createElement('tr');
      gr.className = 'group-row';
      const td = document.createElement('td');
      td.colSpan = cols.length + 2;
      td.textContent = s.g;
      gr.appendChild(td);
      tbody.appendChild(gr);
      lastGroup = s.g;
    }
    const tr = document.createElement('tr');
    tr.className = 'subject-row';

    const tdName = document.createElement('td');
    tdName.className = 'subj-name';
    tdName.textContent = s.name;
    tr.appendChild(tdName);

    let rowTotal = 0;
    cols.forEach(col=>{
      const k = keyFor(
    state.location,
    state.course,
    state.level,
    s.name,
    col
);
      const v = getQty(k);
      rowTotal += v;
      const td = document.createElement('td');
      td.className = 'qty-cell';
      const box = document.createElement('div');
      box.className = 'qty-box';

      const minus = document.createElement('button');
      minus.textContent = '−';
      minus.setAttribute('aria-label', `Decrease ${s.name} ${col}`);
      minus.addEventListener('click', ()=>{
        setQty(k, getQty(k) - 1);
        renderAll();
      });

      const input = document.createElement('input');
      input.type = 'number';
      input.min = '0';
      input.value = v;
      input.setAttribute('aria-label', `${s.name} ${col} quantity`);
      input.addEventListener('change', (e)=>{
        setQty(k, parseInt(e.target.value || '0', 10));
        renderAll();
      });

      const plus = document.createElement('button');
      plus.textContent = '+';
      plus.setAttribute('aria-label', `Increase ${s.name} ${col}`);
      plus.addEventListener('click', ()=>{
        setQty(k, getQty(k) + 1);
        renderAll();
      });

      box.appendChild(minus);
      box.appendChild(input);
      box.appendChild(plus);
      td.appendChild(box);
      tr.appendChild(td);
// Total stock of this book in all branches
const total = getTotalQty(
    state.course,
    state.level,
    s.name,
    col
);

// Create Total column
const tdTotal = document.createElement('td');
tdTotal.className = 'qty-cell';

// Display total
tdTotal.innerHTML = `<strong>${total}</strong>`;

// Add it to the row
tr.appendChild(tdTotal);


    });
    let grandTotal = 0;
cols.forEach(col => {
    grandTotal += getTotalQty(
        state.course,
        state.level,
        s.name,
        col
    );
});
const tdTotal = document.createElement('td');
tdTotal.className = 'qty-cell';
tdTotal.innerHTML = `<strong>${grandTotal}</strong>`;
tr.appendChild(tdTotal);
    const tdStatus = document.createElement('td');
    tdStatus.className = 'stamp-cell';
    const st = statusFor(rowTotal);
    const stamp = document.createElement('span');
    stamp.className = `stamp ${st.cls}`;
    stamp.textContent = st.label;
    tdStatus.appendChild(stamp);
    tr.appendChild(tdStatus);

    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
}

// ---------- Render: dashboard ----------
function renderDash(){
  const el = document.getElementById('dash');
  let titles = 0, copies = 0, low = 0, out = 0;
  COURSES.forEach(course=>{
    LEVELS.forEach(level=>{
      const cols = bookCols(level);
      DATA[course][level].forEach(s=>{
        let rowTotal = 0;
        cols.forEach(col=>{
          const k = keyFor(
    state.location,
    state.course,
    state.level,
    s.name,
    col
);
          const v = getQty(k);
          titles += 1;
          copies += v;
          rowTotal += v;
        });
        if(rowTotal <= 0) out += 1;
        else if(rowTotal <= 10) low += 1;
      });
    });
  });
  el.innerHTML = `
    <div class="cell">
      <div class="num">${titles}</div>
      <div class="lbl">Book Titles Tracked</div>
    </div>
    <div class="cell">
      <div class="num">${copies}</div>
      <div class="lbl">Copies In Register</div>
    </div>
    <div class="cell ${low>0?'alert':''}">
      <div class="num">${low}</div>
      <div class="lbl">Low Stock Subjects</div>
    </div>
    <div class="cell ${out>0?'alert':''}">
      <div class="num">${out}</div>
      <div class="lbl">Out of Stock Subjects</div>
    </div>
  `;
}

function renderAll(){
  renderSpine();
  renderLevelTabs();
  renderTable();
  renderDash();
}

// ---------- Wire up controls ----------
document.getElementById("locationSelect").addEventListener("change", (e) => {
    state.location = e.target.value;
    renderAll();
});

// Search
document.getElementById('search').addEventListener('input', (e)=>{
  state.filter = e.target.value;
  renderTable();
});

document.getElementById('resetBtn').addEventListener('click', async ()=>{
  const ok = confirm("Clear all stock counts across CA and CMA, every level? This cannot be undone.");
  if(!ok) return;
  qty = {};
  try{ await window.storage.set(STORE_KEY, JSON.stringify(qty), false); }catch(e){}
  renderAll();
});

// ---------- Init ----------
(async function init(){
  await loadQty();
  renderAll();
})();
</script>
</body>
</html>
